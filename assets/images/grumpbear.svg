<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Background -->
  <rect width="600" height="400" fill="#1a1a2e"/>

  <!-- App window / phone mockup centered -->
  <rect x="170" y="20" width="260" height="360" rx="28" ry="28" fill="#16213e" stroke="#e8a838" stroke-width="2"/>

  <!-- Status bar -->
  <rect x="170" y="20" width="260" height="36" rx="28" ry="28" fill="#0f3460"/>
  <rect x="170" y="38" width="260" height="18" fill="#0f3460"/>
  <text x="300" y="44" font-family="Arial, sans-serif" font-size="11" fill="#aaa" text-anchor="middle">9:41</text>

  <!-- Bear face circle -->
  <circle cx="300" cy="115" r="42" fill="#e8a838"/>
  <!-- Ears -->
  <circle cx="268" cy="82" r="14" fill="#e8a838"/>
  <circle cx="332" cy="82" r="14" fill="#e8a838"/>
  <circle cx="268" cy="82" r="8" fill="#c4802a"/>
  <circle cx="332" cy="82" r="8" fill="#c4802a"/>
  <!-- Eyes -->
  <circle cx="288" cy="110" r="6" fill="#1a1a2e"/>
  <circle cx="312" cy="110" r="6" fill="#1a1a2e"/>
  <circle cx="290" cy="108" r="2" fill="white"/>
  <circle cx="314" cy="108" r="2" fill="white"/>
  <!-- Snout -->
  <ellipse cx="300" cy="124" rx="12" ry="8" fill="#c4802a"/>
  <!-- Grumpy mouth -->
  <path d="M292 130 Q300 126 308 130" stroke="#1a1a2e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Eyebrows (grumpy) -->
  <line x1="282" y1="102" x2="294" y2="105" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="318" y1="102" x2="306" y2="105" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>

  <!-- App name -->
  <text x="300" y="174" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#e8a838" text-anchor="middle">GrumpBear</text>

  <!-- Timer ring -->
  <circle cx="300" cy="220" r="36" fill="none" stroke="#0f3460" stroke-width="6"/>
  <circle cx="300" cy="220" r="36" fill="none" stroke="#e8a838" stroke-width="6"
    stroke-dasharray="170 56" stroke-dashoffset="0"
    transform="rotate(-90 300 220)"/>
  <text x="300" y="216" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">25:00</text>
  <text x="300" y="230" font-family="Arial, sans-serif" font-size="9" fill="#aaa" text-anchor="middle">FOCUS</text>

  <!-- Task items -->
  <rect x="190" y="272" width="220" height="26" rx="6" fill="#0f3460"/>
  <circle cx="204" cy="285" r="5" fill="none" stroke="#e8a838" stroke-width="1.5"/>
  <text x="216" y="289" font-family="Arial, sans-serif" font-size="11" fill="#ccc">Write report</text>

  <rect x="190" y="303" width="220" height="26" rx="6" fill="#0f3460"/>
  <circle cx="204" cy="316" r="5" fill="#e8a838"/>
  <line x1="201" y1="316" x2="204" y2="319" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="204" y1="319" x2="209" y2="313" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
  <text x="216" y="320" font-family="Arial, sans-serif" font-size="11" fill="#666" text-decoration="line-through">Review PR</text>

  <rect x="190" y="334" width="220" height="26" rx="6" fill="#0f3460"/>
  <circle cx="204" cy="347" r="5" fill="none" stroke="#e8a838" stroke-width="1.5"/>
  <text x="216" y="351" font-family="Arial, sans-serif" font-size="11" fill="#ccc">Push to GitHub</text>

  <!-- SwiftUI / CoreData labels on side -->
  <text x="90" y="170" font-family="Arial, sans-serif" font-size="10" fill="#e8a838" text-anchor="middle" transform="rotate(-90 90 200)">SwiftUI · CoreData · XCTest</text>
  <text x="510" y="190" font-family="Arial, sans-serif" font-size="10" fill="#777" text-anchor="middle" transform="rotate(90 510 200)">UNNotificationCenter · Appium</text>
</svg>
